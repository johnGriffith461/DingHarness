# 本仓已开源（github.com/johnGriffith461/DingHarness），这份 workflow 现在**真在 GitHub Actions 上跑**
# （windows-latest）。判据（手册 B4）：装依赖 → typecheck → test；**明确禁用真实模型与网络**。
# 这一点靠的是结构而不是开关，理由写在下面每一条注释里。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 只读仓库内容：CI 不需要写任何东西
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Electron + NSIS 的 Windows 桌面应用，路径与大小写语义都按 win32 来。
    # 跑在 windows 上也顺带保证 `drivePaths.test.ts` 里那条"大小写不敏感"的断言真的被执行
    # （它在非 Windows 上是 skip 的）。
    runs-on: windows-latest

    env:
      # 「禁止真实模型」这道闸（内核里真的读它：`engine/runtime/loop.ts` 的 realModelBlocked）。
      # 验收脚本与任何真调模型的路径都不在下面这几步里；万一有人把 `pnpm verify:accept`
      # （会真启 Electron 并往输入框填提示词点发送）加进来，这个变量会让每一次远程调用
      # 直接以"DSH_NO_REAL_MODEL 已设置：拒绝调用远程 provider"失败，而不是悄悄烧钱。
      #
      # ⚠️ 2026-10-14 修：在这之前**仓库里没有任何代码读这个变量** —— 注释承诺的闸门是空的
      # （而验收脚本确实会打真模型：整批 99 条跑一遍就是 99 次真调用）。现在它是真的了。
      CI: "true"
      DSH_NO_REAL_MODEL: "1"
      # ⚠️ 画布数据目录（DSH_CANVAS_DATA_DIR）**不能**放这里 —— `runner` 上下文在 job 级 `env`
      # 里不可用，GitHub 会报 `Unrecognized named-value: 'runner'`，整个 workflow 启动即失败。
      # 它放在「单测」那一步的步骤级 env 里。

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Node（版本跟本机一致：24.x LTS）
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 装依赖（锁文件为准，不升级任何东西）
        # 用 --frozen-lockfile：lockfile 与 package.json 不一致就**直接失败**，
        # 而不是悄悄替一份新的出来（B1 刚把 23 个通配依赖锁成具体版本，这条是它的守卫）。
        #
        # ⚠️ **已知本地怪象（如实记录）**：同一条 `pnpm install --frozen-lockfile` 在这台机器上
        # 连跑三次的退出码是 `-1073741819`(0xC0000005 访问冲突) / `-1073741819` / `0` ——
        # 三次的输出都打印了 `Done`，且随后的 typecheck / lint / test 全部退出码 0。
        # 判断是 pnpm 在 Windows 上收尾时偶发崩溃（疑似杀软扫描新链接的 .bin 文件），
        # **不是安装失败**。这里**不做掩盖**（不吞退出码）：如果 CI 上因此变红，
        # 先看它是不是同一现象，再决定要不要顶一层重试；不要把它当"CI 坏了"。
        #
        # ⚠️⚠️ **2026-10-16 更正**：这里原来写着"electron 的 postinstall 会下二进制"——
        # **那是错的**，冒烟 job 第一次真跑就红在这上面（spawn electron.exe → ENOENT）。
        # electron@44 的包**没有 postinstall**（它的 package.json 里没有 `scripts` 字段，
        # 注册表元数据也没有 hasInstallScript），下载改成了显式命令
        # （bin 名 `install-electron` → `install.js`）。
        # 所以 `pnpm install` 只装 JS —— **要 Electron 二进制的 job 自己下**（见 smoke job 那一步）。
        # gates 这组不需要它（纯 node 的门），省下那 ~100MB。
        run: pnpm install --frozen-lockfile

      - name: 类型
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: 依赖审计（Phase 14.3）
        # 供应链门：只在高危及以上红。**允许失败不掩盖** —— 真红了就得看一眼。
        # `--prod` 只看运行时依赖（开发依赖的漏洞不发给用户）。
        run: pnpm audit --audit-level=high --prod

      - name: 单测
        # 纯 node 环境：`vitest.config.ts` 的 include 只有 `src/` 下的测试，
        # 不启 Electron、不连网、不调模型 —— 这是"不烧钱"的结构性保证，不是承诺。
        #
        # 画布持久化的数据目录指向 runner 临时目录，绝不碰任何真实 userData。
        # 放**步骤级**（`runner` 上下文在步骤级 env 可用）。
        env:
          DSH_CANVAS_DATA_DIR: ${{ runner.temp }}/dsh-canvas-data
        run: pnpm test

      # ── 以下**有意不做**（照手册 §7 的"不烧钱地验"）──
      #
      # · `pnpm verify:accept`（约 52 条 Playwright 验收）：每条都要启一个真 Electron 应用，
      #   耗时且历史上 flaky（失败的那条每次都换）。它是**发布前**的门，不是每次 push 的门；
      #   它已经在 `pnpm build` 的链尾，所以不会漏。
      # · `electron-builder` 打包：CI 不出安装包（出包在 `pnpm build` 里做）。
      # · 任何真调模型的脚本（`.verify/ai-smoke.mjs`、`accept-chatartifact.mjs` 等）：
      #   **一条都不跑**。真调模型的能力单独手动跑，见 `.verify/ATTACH-ONLY.md` 的三问。

  # ── 开箱冒烟（M0 工单 4 机制 2：install → launch → 主路径点击）──
  #
  # 为什么**单独一个 job**，而不是并进上面那组纯 node 的门：
  # 它要**真起一次 Electron**（仓库里其余 Playwright 验收都刻意不进 CI，理由见上面那一段：
  # 耗时、历史上偏 flaky）。分开跑有两个好处：主门仍然秒级、且"哪一层红了"一眼看得出来。
  #
  # 它**一条模型都不调**（全走本地 UI 与空态），`DSH_NO_REAL_MODEL` 再兜一层。
  # 依赖主门通过才跑 —— 单测都红的时候没必要再起应用。
  #
  # ⚠️ 如实记下边界：这个 job 是 2026-10-15 新加的，**第一次跑的结果要以 CI 为准**。
  # 若它在 CI 上偶发红（起不来 / CDP 连不上），先看 `.verify/accept-smoke-data/` 与应用日志，
  # 判断是环境还是产品 —— 这台机器上"某段回环端口对 Electron 不通"的坑，
  # `harness.mjs` 的 `pickPort` / `bootApp` 已经换端口重试兜过一层，但 CI 的网络栈与这里不同。
  smoke:
    needs: gates
    runs-on: windows-latest
    env:
      CI: "true"
      DSH_NO_REAL_MODEL: "1"
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Node（跟本机一致：24.x LTS）
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 装依赖（锁文件为准）
        run: pnpm install --frozen-lockfile

      - name: 下 Electron 二进制（冒烟要真起应用）
        # ⚠️ **这一步不能省**（2026-10-16 CI 第一次真跑冒烟时发现的）：
        # electron@44 **没有 postinstall** —— 它的 package.json 里没有 `scripts` 字段
        # （注册表元数据也没有 hasInstallScript），下载改成了显式命令
        # （`install.js`，bin 名 `install-electron`）。
        # 于是 `pnpm install` 只装 JS，`node_modules/electron/dist/electron.exe` 不存在，
        # 冒烟脚本一 spawn 就是 ENOENT。本机之所以一直有 dist/，是当初手动跑过 install.js
        # 留下的 —— 这正是"本机好好的、CI 一跑就红"的原因。
        # 这 ~100MB 是 CI 里唯一的网络下载（不是"调模型"，本 workflow 不配任何模型 key）。
        run: node node_modules/electron/install.js

      - name: 构建渲染产物与主进程
        # 冒烟跑的是**真应用**，所以先把 dist/ 与 dist-electron/ 建出来。
        # 不打包（不出安装包）—— 这一步只为了让应用起得来。
        run: |
          pnpm build:web
          pnpm electron:build

      - name: 开箱冒烟
        # 一次启动走完：启动 → 窗口（自绘标题栏 + 三个按钮）→ 左栏 → 右栏 → 画布 → 设置 → 主路径
        run: node scripts/accept/accept-smoke.mjs

      - name: 失败时把应用日志带上来
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: |
            .verify/accept-smoke-data/
          if-no-files-found: ignore
