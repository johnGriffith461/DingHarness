# 本仓已开源（github.com/johnGriffith461/DingHarness），这份 workflow 现在**真在 GitHub Actions 上跑**
# （windows-latest）。判据（手册 B4）：装依赖 → typecheck → test；**明确禁用真实模型与网络**。
# 这一点靠的是结构而不是开关，理由写在下面每一条注释里。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 只读仓库内容：CI 不需要写任何东西
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Electron + NSIS 的 Windows 桌面应用，路径与大小写语义都按 win32 来。
    # 跑在 windows 上也顺带保证 `drivePaths.test.ts` 里那条"大小写不敏感"的断言真的被执行
    # （它在非 Windows 上是 skip 的）。
    runs-on: windows-latest

    env:
      # 「禁止真实模型」这道闸（内核里真的读它：`engine/runtime/loop.ts` 的 realModelBlocked）。
      # 验收脚本与任何真调模型的路径都不在下面这几步里；万一有人把 `pnpm verify:accept`
      # （会真启 Electron 并往输入框填提示词点发送）加进来，这个变量会让每一次远程调用
      # 直接以"DSH_NO_REAL_MODEL 已设置：拒绝调用远程 provider"失败，而不是悄悄烧钱。
      #
      # ⚠️ 2026-10-14 修：在这之前**仓库里没有任何代码读这个变量** —— 注释承诺的闸门是空的
      # （而验收脚本确实会打真模型：整批 99 条跑一遍就是 99 次真调用）。现在它是真的了。
      CI: "true"
      DSH_NO_REAL_MODEL: "1"
      # ⚠️ 画布数据目录（DSH_CANVAS_DATA_DIR）**不能**放这里 —— `runner` 上下文在 job 级 `env`
      # 里不可用，GitHub 会报 `Unrecognized named-value: 'runner'`，整个 workflow 启动即失败。
      # 它放在「单测」那一步的步骤级 env 里。

    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Node（版本跟本机一致：24.x LTS）
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 装依赖（锁文件为准，不升级任何东西）
        # 用 --frozen-lockfile：lockfile 与 package.json 不一致就**直接失败**，
        # 而不是悄悄替一份新的出来（B1 刚把 23 个通配依赖锁成具体版本，这条是它的守卫）。
        #
        # ⚠️ **已知本地怪象（如实记录）**：同一条 `pnpm install --frozen-lockfile` 在这台机器上
        # 连跑三次的退出码是 `-1073741819`(0xC0000005 访问冲突) / `-1073741819` / `0` ——
        # 三次的输出都打印了 `Done`，且随后的 typecheck / lint / test 全部退出码 0。
        # 判断是 pnpm 在 Windows 上收尾时偶发崩溃（疑似杀软扫描新链接的 .bin 文件），
        # **不是安装失败**。这里**不做掩盖**（不吞退出码）：如果 CI 上因此变红，
        # 先看它是不是同一现象，再决定要不要顶一层重试；不要把它当"CI 坏了"。
        #
        # ⚠️⚠️ **2026-10-16 更正**：这里原来写着"electron 的 postinstall 会下二进制"——
        # **那是错的**，冒烟 job 第一次真跑就红在这上面（spawn electron.exe → ENOENT）。
        # electron@44 的包**没有 postinstall**（它的 package.json 里没有 `scripts` 字段，
        # 注册表元数据也没有 hasInstallScript），下载改成了显式命令
        # （bin 名 `install-electron` → `install.js`）。
        # 所以 `pnpm install` 只装 JS —— **要 Electron 二进制的 job 自己下**（见 smoke job 那一步）。
        # gates 这组不需要它（纯 node 的门），省下那 ~100MB。
        run: pnpm install --frozen-lockfile

      - name: 类型
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: 依赖审计（Phase 14.3）
        # 供应链门：只在高危及以上红。**允许失败不掩盖** —— 真红了就得看一眼。
        # `--prod` 只看运行时依赖（开发依赖的漏洞不发给用户）。
        run: pnpm audit --audit-level=high --prod

      - name: 供给链纪律（V6-3b）
        # 版本钉住 / 构建脚本白名单 / 锁文件版本 / minimumReleaseAge / CLI 包依赖一致
        run: pnpm verify:supply-chain

      - name: 单测
        # ⚠️ 2026-10-16（审计 G97）**更正**：这里原来写着"include 只有 `src/` 下的测试"——
        # 那是旧事实。`vitest.config.ts` 早就把 include 扩到了 `src` / `engine` / `hosts` / `shared`，
        # 所以这条跑的东西比原来那句说的多得多（`agentServer` / `agent` / `hostParity` 这些 e2e 级单测都在跑）。
        # "不烧钱"仍然成立，但**理由得换成对的**：引擎与宿主那批测试一律走 `engine/eval/fakeProvider.ts`
        # 起的本地假通道（回环、脚本化回复），且 `DSH_NO_REAL_MODEL=1` 兜底 ——
        # 不是"只看 src/ 所以不可能烧钱"。若有新测试引入真调用，这里就会红。
        #
        # 画布持久化的数据目录指向 runner 临时目录，绝不碰任何真实 userData。
        # 放**步骤级**（`runner` 上下文在步骤级 env 可用）。
        env:
          DSH_CANVAS_DATA_DIR: ${{ runner.temp }}/dsh-canvas-data
        run: pnpm test

      - name: CLI 产物（npm 那条路：dist-cli）
        # ⚠️ 2026-10-16（审计 G40/G63/G95）：**发出去的那份 CLI** 在这之前一条门都没有 ——
        # `package.json` 的 `bin.ding` 与 `files` 都指 `dist-cli/`（tsc 产物），
        # 而它不在 build 链、不在 CI、`verify:artifacts` 也不看它；
        # 仓里唯一那条 `verify-cli-bin.mjs` 验的是 Bun 编的 `dist-bin/*.exe` —— **两个产物不是同一个**。
        # 代价当场就撞上了：加这一步时 `pnpm cli:build` 根本编不过
        # （`sandbox.ts` 用了 Electron 独有的 `process.resourcesPath`，CLI 的 tsconfig 看不见）。
        #
        # 这一步纯 node、零网络、零模型：`--help` / `sessions` / `models` / `doctor` / `eval`，
        # 最后一条会把整条链（装配 → SQLite → 引擎 → 工具 → 闸门 → 事件 → 投影）走一遍，
        # 并与源树的那一跑对照条数 —— 产物少带一个随附文件就会红。
        run: |
          pnpm cli:build
          node scripts/verify-cli-npm.mjs

      - name: SDK 包（V5-4 4.1/4.2：两个包独立构建 + 打包冒烟）
        # 两个包（ding-engine-core / ding-engine）真构建 → npm pack → 解进一个**干净工程**
        # → 原样跑 examples/sdk-turn 的两个示例（假端点，零出网零花费）。
        # 同一段里还把两条契约判据钉住：engine-core 的产物不含 node:*（最小面），
        # ding-engine 的产物含 node:fs（完整面）；公开面清单的对账在 `pnpm test`
        # 的 src/sdkApiFreeze.test.ts 里（那一条不需要构建）。
        #
        # ⚠️ 这就是 RELEASE.md 里"示例仓 CI 验证"的落点：示例在仓内，验的就是它。
        run: pnpm verify:sdk

      - name: 画布 MCP server（V5-4 4.5：外部客户端驱动画布）
        # 起 server（stdio）→ 以 MCP 客户端握手 → tools/call 加节点 → **读磁盘上的画布文档**
        # 确认真的改了。数据目录是临时目录，不碰用户那张画布；零出网。
        run: pnpm verify:canvas-mcp

      # ── 以下**有意不做**（照手册 §7 的"不烧钱地验"）──
      #
      # · **全量** `pnpm verify:accept`（现在 60+ 条 Playwright 验收）：每条都要启一个真 Electron
      #   应用，全量约 1–2 小时。它是**发布前**的门（在 `pnpm build` 链尾），不是每次 push 的门。
      #   ⚠️ 2026-10-16 更正（审计 G44）：下面那个 `accept` job 现在**每次 push 都跑一个子集**
      #   （12 条、约 10 分钟）—— 全量仍不进 CI，但"CI 完全不碰验收"这句已经不对了。
      # · `electron-builder` 打包：CI 不出安装包（出包在 `pnpm build` 里做）。
      # · 任何真调模型的脚本（`.verify/ai-smoke.mjs`、`accept-writing-model.mjs` 等）：
      #   **一条都不跑**。真调模型的能力单独手动跑，见 `scripts/accept/ATTACH-ONLY.md` 的三问。
      #   ⚠️ 2026-10-16（审计第 6 单）：这里原来举例 `accept-chatartifact.mjs` —— 那个脚本
      #   随聊天子系统一起删了，仓里根本没有它（`src/docClaims.test.ts` ③ 就是逮这一类的守卫）。
      #   ⚠️ 2026-10-16（审计 P94 同类）：这里原来写的是 `.verify/ATTACH-ONLY.md` ——
      #   那个路径**不存在**（`.verify/` 是本地记录目录，整目录不入库），
      #   真文件在 `scripts/accept/` 下、跟着版本库走。顺着注释找不到东西＝决策链断在注释里。
      #   验收批跑自带**本地假通道** + `DSH_NO_REAL_MODEL=1`，所以它里面跑的条目
      #   一条真调用都不会发（这一点由 `scripts/verify-acceptances.mjs` 的
      #   `startLocalFakeModel` + 凭据文件固定，不靠"记得别配 key"）。

  # ── 开箱冒烟（M0 工单 4 机制 2：install → launch → 主路径点击）──
  #
  # 为什么**单独一个 job**，而不是并进上面那组纯 node 的门：
  # 它要**真起一次 Electron**（仓库里其余 Playwright 验收都刻意不进 CI，理由见上面那一段：
  # 耗时、历史上偏 flaky）。分开跑有两个好处：主门仍然秒级、且"哪一层红了"一眼看得出来。
  #
  # 它**一条模型都不调**（全走本地 UI 与空态），`DSH_NO_REAL_MODEL` 再兜一层。
  # 依赖主门通过才跑 —— 单测都红的时候没必要再起应用。
  #
  # ⚠️ 如实记下边界：这个 job 是 2026-10-15 新加的，**第一次跑的结果要以 CI 为准**。
  # 若它在 CI 上偶发红（起不来 / CDP 连不上），先看 `.verify/accept-smoke-data/` 与应用日志，
  # 判断是环境还是产品 —— 这台机器上"某段回环端口对 Electron 不通"的坑，
  # `harness.mjs` 的 `pickPort` / `bootApp` 已经换端口重试兜过一层，但 CI 的网络栈与这里不同。
  smoke:
    needs: gates
    runs-on: windows-latest
    env:
      CI: "true"
      DSH_NO_REAL_MODEL: "1"
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Node（跟本机一致：24.x LTS）
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 装依赖（锁文件为准）
        run: pnpm install --frozen-lockfile

      - name: 下 Electron 二进制（冒烟要真起应用）
        # ⚠️ **这一步不能省**（2026-10-16 CI 第一次真跑冒烟时发现的）：
        # electron@44 **没有 postinstall** —— 它的 package.json 里没有 `scripts` 字段
        # （注册表元数据也没有 hasInstallScript），下载改成了显式命令
        # （`install.js`，bin 名 `install-electron`）。
        # 于是 `pnpm install` 只装 JS，`node_modules/electron/dist/electron.exe` 不存在，
        # 冒烟脚本一 spawn 就是 ENOENT。本机之所以一直有 dist/，是当初手动跑过 install.js
        # 留下的 —— 这正是"本机好好的、CI 一跑就红"的原因。
        # 这 ~100MB 是 CI 里唯一的网络下载（不是"调模型"，本 workflow 不配任何模型 key）。
        run: node node_modules/electron/install.js

      - name: 构建渲染产物与主进程
        # 冒烟跑的是**真应用**，所以先把 dist/ 与 dist-electron/ 建出来。
        # 不打包（不出安装包）—— 这一步只为了让应用起得来。
        run: |
          pnpm build:web
          pnpm electron:build

      - name: 开箱冒烟
        # 一次启动走完：启动 → 窗口（自绘标题栏 + 三个按钮）→ 左栏 → 右栏 → 画布 → 设置 → 主路径
        run: node scripts/accept/accept-smoke.mjs

      - name: 失败时把应用日志带上来
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: |
            .verify/accept-smoke-data/
          if-no-files-found: ignore

  # ── CLI 单二进制（2026-10-16，审计 G63）──
  #
  # `cli:bin` + `verify-cli-bin.mjs` 是本轮质量最高的一条**产物级端到端**（剥掉 PATH 只剩系统目录、
  # 跑 `ding eval` 走完整链），但它建好之后**既不在 build 链也不在 CI** —— 等于"手动跑的门禁"，
  # 正撞 `buildGate.test.ts` 自述的那句"一道会悄悄消失的检查等于没有"。
  #
  # 为什么单开一个 job（而不是塞进 gates）：
  #   · 它要 **Bun**（单二进制那条路全靠它编）—— gates 那组是纯 node 的门，不该被一个工具链绑住；
  #   · 它要编一个 ~60MB 的单文件再跑起来，比 gates 慢得多，混在一起会拖慢"哪一层红了"的判断。
  #
  # 边界（如实记）：这里只编/验 **Windows x64** 那个（`--only win`）——本机与 CI 都是 windows-latest，
  # 另外三个平台能编出来但**没在对应系统上跑过**，那件事写在 `dist-bin/BUILD-NOTES.md` 里。
  cli-bin:
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DSH_NO_REAL_MODEL: "1"
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Node（跟本机一致：24.x LTS）
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 装依赖（锁文件为准）
        run: pnpm install --frozen-lockfile

      - name: 装 Bun（单二进制那条路要它）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 编 Windows x64 单二进制
        # `--only win`：另外三个平台能编，但本 job 跑不了它们 —— 不编一堆跑不了的产物。
        # `build-cli-bin.mjs` 自己带前置冒烟门（Bun 下 SQLite 端口真建库/写/读），门不过就不出产物。
        run: node scripts/build-cli-bin.mjs --only win

      - name: 验单二进制（剥 PATH + 跑 --help/sessions/models/doctor/eval）
        run: node scripts/verify-cli-bin.mjs

      - name: 失败时把产物说明与日志带上来
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-bin-notes
          path: |
            dist-bin/BUILD-NOTES.md
          if-no-files-found: ignore

  # ── 验收**子集**（2026-10-16，审计 G44：CI 明确不跑批跑）──
  #
  # 全量批跑要 1–2 小时（60+ 条、每条起一个真应用），不适合每次 push；
  # 但"完全不跑"意味着任何一条脚本过期都没人知道（§97 就是这么撞到的）。
  # 所以：**每次 push 跑一个固定子集**（快、稳、覆盖到关键机制），全量留给 `pnpm build`。
  #
  # 子集怎么挑：① 不依赖打包产物；② 单条 <90 秒；③ 合起来覆盖
  # 窗口/面板/画布输入/记忆/搜索/任务中心/首页/资料/会话日志/中止/存储后端。
  # `DSH_ACCEPT_TIMEOUT_MS` 收紧到 90 秒 —— CI 上一条卡住不该拖住整条流水线。
  accept:
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: "true"
      DSH_NO_REAL_MODEL: "1"
      DSH_ACCEPT_TIMEOUT_MS: "90000"
      # 批跑自己的假通道与凭据由 `scripts/verify-acceptances.mjs` 接管（见它的注释）
      DSH_ACCEPT_ONLY: >-
        accept-chips.mjs,accept-panels.mjs,accept-windowctl.mjs,accept-memory.mjs,
        accept-shortcuts.mjs,accept-suggestions.mjs,accept-taskcenter.mjs,
        accept-searchhistory.mjs,accept-material.mjs,accept-sessionlog.mjs,
        accept-abort.mjs,accept-kvstore.mjs
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 装 Node（跟本机一致：24.x LTS）
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装 pnpm（版本取自 package.json 的 packageManager）
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 装依赖（锁文件为准）
        run: pnpm install --frozen-lockfile

      - name: 下 Electron 二进制（验收要真起应用；electron@44 没有 postinstall）
        run: node node_modules/electron/install.js

      - name: 构建渲染产物与主进程
        run: |
          pnpm build:web
          pnpm electron:build

      - name: 验收子集（自带假通道 + 零出网闸）
        run: node scripts/verify-acceptances.mjs

      - name: 失败时把批跑日志带上来
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accept-logs
          path: |
            .verify/accept-fail-*.log
            .verify/accept-history.json
          if-no-files-found: ignore
